name: E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install uvicorn fastapi

      - name: Install Node Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start FastAPI Backend
        run: |
          cd backend && python -m uvicorn app.main:app --port 8000 &

      - name: Wait for Backend Server
        run: |
          python -c "import time, urllib.request; [time.sleep(1) for _ in range(30) if not urllib.request.urlopen('http://127.0.0.1:8000/api/models/registry').read()]" || true

      - name: Start Frontend & Run E2E Tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload E2E Downloads on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-downloads
          path: e2e/downloads/
