name: E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install uvicorn fastapi

      - name: Install Node Dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start FastAPI Backend
        run: |
          cd backend && python -m uvicorn app.main:app --port 8000 &

      - name: Wait for Backend Server
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/api/models/registry"
          for attempt in range(1, 31):
              try:
                  with urllib.request.urlopen(url, timeout=2) as resp:
                      resp.read()
                  print(f"Backend ready after {attempt} attempt(s)")
                  break
              except (urllib.error.URLError, TimeoutError) as exc:
                  print(f"Waiting for backend... ({attempt}/30) {exc}")
                  time.sleep(2)
          else:
              raise SystemExit("Backend did not become ready in time")
          PY

      - name: Start Frontend Dev Server
        run: |
          cd frontend && npm run dev &
          # Wait for Vite to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            echo "Waiting for frontend... ($i)"
            sleep 2
          done

      - name: Verify Frontend Serves Content
        run: |
          echo "--- Checking localhost:3000 ---"
          curl -s http://localhost:3000 | head -50
          echo "--- Done ---"

      - name: Run E2E Tests
        run: npx playwright test
        env:
          CI: true
          BASE_URL: http://localhost:3000

      - name: Upload Playwright Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Playwright Test Results on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/

      - name: Upload E2E Downloads on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-downloads
          path: e2e/downloads/
          if-no-files-found: ignore
